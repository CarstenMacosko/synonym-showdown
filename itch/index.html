<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Synonym Showdown</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        overflow: hidden;
        font-family: 'Comic Sans MS', system-ui, sans-serif;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 16px;
        color: #2b2b2b;
      }
      #fallback a {
        font-size: 1.4rem;
        color: #2b2b2b;
      }
    </style>
  </head>
  <body>
    <!--
      Synonym Showdown for itch.io. This page shows the live game from https://synonymshowdown.com, so it's
      always up to date and online play (rooms with friends) works. "?portal=itch" hides sign-in, which
      can't work inside itch.io's frame.
    -->
    <iframe
      id="game"
      src="https://synonymshowdown.com/?portal=itch"
      title="Synonym Showdown"
      allow="autoplay; fullscreen; clipboard-write; web-share"
      allowfullscreen
    ></iframe>
    <div id="fallback">
      <p>The game couldn’t load here.</p>
      <a href="https://synonymshowdown.com/" target="_blank" rel="noopener">Play Synonym Showdown at synonymshowdown.com</a>
    </div>
    <script>
      // If the game hasn't loaded after 15 seconds (blocked network, offline), offer a direct link.
      var loaded = false;
      document.getElementById('game').addEventListener('load', function () {
        loaded = true;
      });
      setTimeout(function () {
        if (!loaded) document.getElementById('fallback').style.display = 'flex';
      }, 15000);
    </script>
  </body>
</html>
